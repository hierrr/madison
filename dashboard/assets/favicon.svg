<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -18 512 496">
  <!-- MADISON 파비콘 v2 — 원본 구조·색 그대로(글로우는 16px에서 서브픽셀이라 생략). 라이트/다크 테마 값 내장 -->
  <style>
    .teal    { --c: #00A9C4; } .tealdeep{ --c: #007F94; } .blue  { --c: #2E62D9; }
    .violet  { --c: #6A44E0; } .purple  { --c: #9C2FD6; } .gold  { --c: #E8A70C; }
    .coral   { --c: #E83A72; } .slate   { --c: #B9C6DD; }
    @media (prefers-color-scheme: dark) {
      .teal    { --c: #00E5FF; } .tealdeep{ --c: #00B3C6; } .blue  { --c: #3D7BFF; }
      .violet  { --c: #8A5CFF; } .purple  { --c: #C44BFF; } .gold  { --c: #FFD60A; }
      .coral   { --c: #FF4D8D; } .slate   { --c: #46587E; }
    }
    stop { stop-color: var(--c); }
    .nd  { fill: var(--c); }
  </style>
  <defs>
    <linearGradient id="hex"  gradientUnits="userSpaceOnUse" x1="240" y1="458" x2="240" y2="2">
      <stop offset="0" class="purple"/><stop offset="1" class="teal"/>
    </linearGradient>
    <linearGradient id="blTl" gradientUnits="userSpaceOnUse" x1="110.1" y1="305" x2="110.1" y2="155">
      <stop offset="0" class="tealdeep"/><stop offset="1" class="teal"/>
    </linearGradient>
    <linearGradient id="cTl"  gradientUnits="userSpaceOnUse" x1="110.1" y1="155" x2="240" y2="230">
      <stop offset="0" class="teal"/><stop offset="1" class="blue"/>
    </linearGradient>
    <linearGradient id="cTr"  gradientUnits="userSpaceOnUse" x1="240" y1="230" x2="369.9" y2="155">
      <stop offset="0" class="blue"/><stop offset="1" class="violet"/>
    </linearGradient>
    <linearGradient id="trBr" gradientUnits="userSpaceOnUse" x1="369.9" y1="305" x2="369.9" y2="155">
      <stop offset="0" class="purple"/><stop offset="1" class="violet"/>
    </linearGradient>
  </defs>
  <path d="M240 2 437.4 116 437.4 344 240 458 42.6 344 42.6 116Z"
        fill="none" stroke="url(#hex)" stroke-width="14" stroke-linejoin="round"/>
  <g class="slate" fill="none" stroke-width="5" stroke-linecap="round" style="stroke: var(--c)">
    <path d="M240 80 369.9 155"/><path d="M369.9 305 240 380"/>
    <path d="M240 380 110.1 305"/><path d="M110.1 155 240 80"/>
    <path d="M240 230 240 80"/><path d="M240 230 369.9 305"/>
    <path d="M240 230 240 380"/><path d="M240 230 110.1 305"/>
  </g>
  <path d="M110.1 305 110.1 155" fill="none" stroke="url(#blTl)" stroke-width="10" stroke-linecap="round"/>
  <path d="M110.1 155 240 230"   fill="none" stroke="url(#cTl)"  stroke-width="10" stroke-linecap="round"/>
  <path d="M240 230 369.9 155"   fill="none" stroke="url(#cTr)"  stroke-width="10" stroke-linecap="round"/>
  <path d="M369.9 305 369.9 155" fill="none" stroke="url(#trBr)" stroke-width="10" stroke-linecap="round"/>
  <circle class="nd gold"     cx="240"   cy="80"  r="20"/>
  <circle class="nd violet"   cx="369.9" cy="155" r="24"/>
  <circle class="nd purple"   cx="369.9" cy="305" r="24"/>
  <circle class="nd coral"    cx="240"   cy="380" r="20"/>
  <circle class="nd tealdeep" cx="110.1" cy="305" r="24"/>
  <circle class="nd teal"     cx="110.1" cy="155" r="24"/>
  <circle class="nd blue"     cx="240"   cy="230" r="32"/>
</svg>
